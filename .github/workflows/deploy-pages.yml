name: Redirect legacy GitHub Pages
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Verified HTTPS Vercel production URL
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate redirect pages
        env:
          TARGET_SITE_URL: ${{ inputs.site_url }}
        run: node scripts/build-pages-redirect.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-out
      - uses: actions/deploy-pages@v4
        id: deploy
